# 统一 TLS 入口 + 多服务路径反代
# 放在 nginx 的 server{} 里，或拆成 conf.d/*.conf（含 server 块）
#
# 踩过的坑（见 docs/runbook.md 案例 3）：
#   1) proxy_pass 结尾的斜杠决定是否剥离路径前缀，漏了就 404
#   2) 应用生成绝对路径静态资源时，单靠反代救不回来，要在应用侧配 base URL

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP 全量跳 HTTPS
server {
    listen 80;
    server_name example.com;

    # 证书续期校验路径要放行明文
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/example.com.pem;
    ssl_certificate_key /etc/nginx/certs/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 上传/同步类服务需要放宽
    client_max_body_size 512m;

    access_log /var/log/nginx/example.access.log;
    error_log  /var/log/nginx/example.error.log warn;

    # ── 子路径反代：注意 proxy_pass 结尾的 "/"，它会把 /wavelog 前缀剥掉
    location /wavelog/ {
        proxy_pass http://192.168.1.6:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /wavelog;
        # WebSocket 支持（面板/实时日志类服务必需）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 静态下载目录
    location /download/ {
        alias /volume1/web/download/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── 兜底
    location / {
        proxy_pass http://192.168.1.6:8087/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
